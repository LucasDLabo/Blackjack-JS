<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto de JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900">

    <section class="flex items-center">
        <div class="flex h-32 flex-col gap-2">
            <h1 class="text-5xl text-white font-extrabold">Blackjack</h1>
            <button id="btnStart" class="rounded-md bg-green-800 px-6 py-3 text-white">Start Game</button>
            <div class="flex my-5 gap-2 items-center invisible" id="handButtons"  >
                <button id="btnStand" class="rounded-md bg-red-800 px-6 py-3 text-white">Stand</button>
                <button id="btnHit" class="rounded-md bg-blue-800 px-6 py-3 text-white">Hit</button>
                <button id="btnNextHand" class="invisible rounded-md bg-gray-800 px-6 py-3 text-white">Next Hand</button>
            </div>
        </div>

        <div id="betArea" class="text-white flex w-full flex-col justify-center pl-10 invisible bg-green-950/30">
            <h2>Place your bet</h2>
            <div class="bg-blue-900/30 flex flex-row h-full items-center gap-10">
                
                <div id="chips">
                    <button data-value="1" class="chip aspect-square w-16 rounded-full border-4 border-dotted border-white bg-gray-500 font-bold transition-transform active:scale-90">$1</button>
                    <button data-value="5"  class="chip aspect-square w-16 rounded-full border-4 border-dotted border-white bg-red-800 font-bold transition-transform active:scale-90">$5</button>
                    <button data-value="25"  class="chip aspect-square w-16 rounded-full border-4 border-dotted border-white bg-green-800 font-bold transition-transform active:scale-90">$25</button>
                    <button data-value="50"  class="chip aspect-square w-16 rounded-full border-4 border-dotted border-white bg-blue-900 font-bold transition-transform active:scale-90">$50</button>
                    <button data-value="100"  class="chip aspect-square w-16 rounded-full border-4 border-dotted border-white bg-gray-800 font-bold transition-transform active:scale-90">$100</button>
                    <button data-value="500"  class="chip aspect-square w-16 rounded-full border-4 border-dotted border-white bg-purple-900 font-bold transition-transform active:scale-90">$500</button>
                </div>
                <div id="currentBet" class="flex flex-col">
                    <p>Money: $<span id="balance">1000</span></p>
                    <span>Current Bet</span>
                    <span class="bg-black text-center">
                        <span>$<span id="totalBet"></span></span>
                    </span>
                    <button id="btnClear" class="bg-gray-700 rounded-md">Clear</button>
                </div>
                <div class="flex items-center">
                    <button id="btnBet" class="bg-green-800 rounded-md w-16 h-10">Deal!</button>
                </div>
            </div>
        </div>
    </section>

    <section id="gameBoard" class="flex h-[calc(100vh-128px)] w-full flex-col justify-center">
        <div class="relative h-full bg-orange-900/40">
            <div class="absolute left-1/2 top-1/2 -z-10 -translate-x-1/2 -translate-y-1/2 select-none text-center text-[10rem] font-bold uppercase tracking-widest">
                Dealer
            </div>

            <div class="flex h-full flex-col items-center justify-center">
                <div id="dealerScore" class="invisible h-6 text-base font-medium text-white"></div>
                <div id="dealerShow" class="mb-6 h-[140px]"></div>
            </div>
        </div>
        <div class="relative h-full bg-green-900/40">
            <div class="absolute left-1/2 top-1/2 -z-10 -translate-x-1/2 -translate-y-1/2 select-none text-center text-[10rem] font-bold uppercase tracking-widest">
                You
            </div>
            <div class="flex h-full flex-col items-center justify-center">
                <div id="playerScore" class="text-base font-medium text-white"></div>
                <div id="playerShow" class="mb-6 h-[140px]"></div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>

</body>

</html>
