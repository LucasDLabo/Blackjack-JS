<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto de JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex flex-col">

    <section class="flex items-center lg:justify-start justify-center order-2 lg:order-1 lg:h-auto h-56">
        <div id="startSection" class="lg:flex flex h-32 flex-col gap-3 px-3 justify-center lg:items-start w-full lg:w-auto 2xl:px-10">
            <h1 class="lg:text-4xl text-5xl  text-white font-extrabold text-center italic">Blackjack<span class="text-[#F0DB4F] not-italic">JS</span> </h1>
            <button id="btnStart" class="rounded-md bg-green-800 px-6 py-3 text-white">Start Game</button>
        </div>

        <section class="lg:flex lg:w-full">
            <div id="betArea" class="text-white px-3 lg:border-slate-800 lg:border-l-4 w-full h-32 flex-col justify-center hidden">
                <h2 id="h2text" class="absolute top-0.5 italic font-semibold text-sm text-gray-600">Place your bet</h2>
                <div class="flex flex-row w-full h-full items-center justify-center gap-5">

                    <div id="controls" class="flex xl:min-w-[550px] lg:min-w-[12rem] lg:pt-2.5 ml-5 h-full items-center">
                        <div id="chips" class="flex-wrap flex justify-between w-full 2xl:gap-2">
                            <button data-value="1" class="chip border-white bg-gray-500 hover:opacity-85 active:scale-95">$1</button>
                            <button data-value="5"  class="chip border-white bg-red-800 hover:opacity-85 active:scale-95">$5</button>
                            <button data-value="25"  class="chip border-white bg-green-800 hover:opacity-85 active:scale-95">$25</button>
                            <button data-value="50"  class="chip border-white bg-blue-900 hover:opacity-85 active:scale-95">$50</button>
                            <button data-value="100"  class="chip border-white bg-gray-800 hover:opacity-85 active:scale-95">$100</button>
                            <button data-value="500"  class="chip border-white bg-purple-900 hover:opacity-85 active:scale-95">$500</button>
                            <button data-value="1000"  class="chip border-white bg-orange-700 hover:opacity-85 active:scale-95">$1000</button>
                            <button data-value="5000"  class="chip border-black bg-slate-300 text-black hover:opacity-85 active:scale-95">$5000</button>
                        </div>
                        <div id="handButtons" class="hidden justify-evenly items-center h-full w-full 2xl:gap-5">
                            <button id="btnHit" title="Take a card" class="h-12 w-28 2xl:w-32 flex items-center justify-center rounded-md bg-blue-800 text-white hover:bg-blue-700 disabled:hover:bg-blue-800 active:scale-95 transition-transform duration-75">
                                <span class="font-medium text-center w-full border-r-2 h-full flex justify-center items-center">Hit</span>
                                <div class=" h-6 w-6 2xl:h-8 2xl:w-8 aspect-square mx-0.5">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                    </svg> 
                                </div>
                            </button>
                            <button id="btnStand" title="End your turn with this hand" class="h-12 w-28 2xl:w-32 flex items-center justify-center rounded-md bg-red-800 text-white hover:bg-red-700 disabled:hover:bg-red-800 active:scale-95 transition-transform duration-75">
                                <span class="font-medium text-center w-full border-r-2 h-full flex justify-center items-center">Stand</span>
                                <div class="h-6 w-6 2xl:h-8 2xl:w-8 aspect-square">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 256 256">
                                        <path d="M188,88a27.75,27.75,0,0,0-12,2.71V60a28,28,0,0,0-41.36-24.6A28,28,0,0,0,80,44v6.71A27.75,27.75,0,0,0,68,48,28,28,0,0,0,40,76v76a88,88,0,0,0,176,0V116A28,28,0,0,0,188,88Zm12,64a72,72,0,0,1-144,0V76a12,12,0,0,1,24,0v44a8,8,0,0,0,16,0V44a12,12,0,0,1,24,0v68a8,8,0,0,0,16,0V60a12,12,0,0,1,24,0v68.67A48.08,48.08,0,0,0,120,176a8,8,0,0,0,16,0,32,32,0,0,1,32-32,8,8,0,0,0,8-8V116a12,12,0,0,1,24,0Z"></path>
                                    </svg>
                                </div>
                            </button>
                            <button id="btnDouble" title="Double your bet and take one more card" class="h-12 w-28 2xl:w-32 flex items-center justify-center rounded-md bg-green-900 text-white hover:bg-green-800 disabled:hover:bg-green-900 active:scale-95 transition-transform duration-75">
                                <span class="font-medium text-center w-full border-r-2 h-full flex justify-center items-center">Double</span>
                                <div class="w-6 h-6 2xl:h-8 2xl:w-8 aspect-square">
                                    <span class="font-bold text-md 2xl:text-xl">x2</span>
                                </div>
                            </button>
                            <button id="btnInsurance" title="Protect your bet if dealer has blackjack" class="flex h-12 w-28 2xl:w-32 items-center justify-center rounded-md bg-cyan-600 text-white transition-transform duration-75 hover:bg-cyan-500 active:scale-95 disabled:hover:bg-cyan-600">
                                <span class="font-medium text-center w-full border-r-2 h-full flex justify-center items-center">Insurance</span>
                                <div class=" h-6 w-6 2xl:h-8 2xl:w-8 aspect-square">
                                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 20a16.405 16.405 0 0 1-5.092-5.804A16.694 16.694 0 0 1 5 6.666L12 4l7 2.667a16.695 16.695 0 0 1-1.908 7.529A16.406 16.406 0 0 1 12 20Z"/>
                                    </svg>
                                </div>
                            </button>
                        </div>
                        <div>
                            <button id="btnNextHand" class="hidden h-12 w-32 items-center justify-center rounded-md bg-gray-700 text-white hover:bg-gray-600 active:scale-95">
                                <span class="font-medium text-center w-full border-r-2 h-full flex justify-center items-center">Next Hand</span>
                                <div class=" h-6 w-6 aspect-square ml-0.5">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path fill-rule="evenodd" d="M13.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06-1.06L11.69 12 4.72 5.03a.75.75 0 0 1 1.06-1.06l7.5 7.5Z" clip-rule="evenodd" />
                                        <path fill-rule="evenodd" d="M19.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06L17.69 12l-6.97-6.97a.75.75 0 0 1 1.06-1.06l7.5 7.5Z" clip-rule="evenodd" />
                                    </svg>
                                </div>
                                
                            </button>
                        </div>
                    </div>
                    
                    <section class="flex items-center flex-col lg:flex-row">
                        <div id="currentBet" class="flex flex-col items-center min-w-28 bg-slate-800 rounded-md h-fit">
                            <div class="font-medium text-green-500 flex items-center justify-between min-w-full px-2 pt-1">
                                <p class="text-center">$<span id="balance">1000</span></p>
                                <button id="btnResetMoney" title="Reset money" class="hidden">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 cursor-pointer hover:text-white transition-colors">
                                        <path fill-rule="evenodd" d="M4.755 10.059a7.5 7.5 0 0 1 12.548-3.364l1.903 1.903h-3.183a.75.75 0 1 0 0 1.5h4.992a.75.75 0 0 0 .75-.75V4.356a.75.75 0 0 0-1.5 0v3.18l-1.9-1.9A9 9 0 0 0 3.306 9.67a.75.75 0 1 0 1.45.388Zm15.408 3.352a.75.75 0 0 0-.919.53 7.5 7.5 0 0 1-12.548 3.364l-1.902-1.903h3.183a.75.75 0 0 0 0-1.5H2.984a.75.75 0 0 0-.75.75v4.992a.75.75 0 0 0 1.5 0v-3.18l1.9 1.9a9 9 0 0 0 15.059-4.035.75.75 0 0 0-.53-.918Z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <button id="btnAllin" title="All-in" >
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5 cursor-pointer ml-1 hover:text-white transition-colors">
                                        <path fill-rule="evenodd" d="M10 1c3.866 0 7 1.79 7 4s-3.134 4-7 4-7-1.79-7-4 3.134-4 7-4Zm5.694 8.13c.464-.264.91-.583 1.306-.952V10c0 2.21-3.134 4-7 4s-7-1.79-7-4V8.178c.396.37.842.688 1.306.953C5.838 10.006 7.854 10.5 10 10.5s4.162-.494 5.694-1.37ZM3 13.179V15c0 2.21 3.134 4 7 4s7-1.79 7-4v-1.822c-.396.37-.842.688-1.306.953-1.532.875-3.548 1.369-5.694 1.369s-4.162-.494-5.694-1.37A7.009 7.009 0 0 1 3 13.179Z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>

                            <span class="text-sm mt-1 mb-0.5 text-center">Current Bet</span>
                            <div class="bg-black text-center w-full justify-between font-medium flex items-center h-7 px-2 rounded-b-md">
                                <span class="">$<span id="totalBet" ></span></span>
                                <button id="btnClear" title="Clear bet">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 cursor-pointer transition-colors text-slate-700 hover:text-white">
                                        <path fillRule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clipRule="evenodd" />
                                    </svg>
                                </button>
                            </div>

                        </div>
                        <div>
                            <button id="btnBet" class="flex h-10 w-24 items-center justify-center rounded-md bg-green-800 text-white transition-transform duration-75 hover:bg-green-700 active:scale-95">
                                <span class="font-medium text-center w-full border-r-2 h-full flex justify-center items-center">Deal</span>
                                <div class="h-6 w-6 aspect-square ml-[.15rem] mr-0.5">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" fill="none"/>
                                        <ellipse cx="96" cy="84" rx="80" ry="36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                                        <path d="M16,84v40c0,19.88,35.82,36,80,36s80-16.12,80-36V84" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="64" y1="117" x2="64" y2="157" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M176,96.72c36.52,3.34,64,17.86,64,35.28,0,19.88-35.82,36-80,36-19.6,0-37.56-3.17-51.47-8.44" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M80,159.28V172c0,19.88,35.82,36,80,36s80-16.12,80-36V132" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="192" y1="165" x2="192" y2="205" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="128" y1="117" x2="128" y2="205" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                                    </svg>
                                </div>
                                
                            </button>
                        </div>
                    </section>
                </div>
            </div>

            
            <div id="runningCount" class="hidden border-slate-800 justify-center lg:border-l-4 xl:max-w-80 lg:bg-orange-300 lg:max-w-52 w-full lg:h-32 flex-col px-3">
                <h2 id="" class="absolute top-0.5 italic font-semibold text-sm text-gray-600">Running Count</h2>
                
                <div class="flex flex-col items-center">
                    <h3 id="totalCounter" class="font-bold text-slate-400 text-base lg:py-1">Total Cards: </h3>
                    <h4 id="givenCounter" class="font-medium text-gray-300 bg-slate-800 w-7/12 text-center lg:py-0.5 rounded-lg mb-1">
                        Cards given: <span class="text-blue-400 font-bold">0</span>
                    </h4>
                    <h4 id="remainingCounter"class="font-medium text-gray-300 bg-slate-800 w-7/12 text-center lg:py-0.5 rounded-lg">
                        Remaining: <span class="text-green-400 font-bold">0</span>
                    </h4>
                </div>
            </div>
        </section>
    </section>

    <section id="gameBoard" class="flex lg:h-[calc(100vh-128px)] h-[calc(100vh-224px)]  w-full order-1 lg:order-2 flex-col justify-center">
        <div class="relative h-full bg-orange-900/40">
            <div class="absolute left-1/2 top-1/2 -z-10 -translate-x-1/2 -translate-y-1/2 select-none text-center text-6xl md:text-[10rem] 2xl:text-[200px] font-bold uppercase tracking-widest">
                Dealer
            </div>

            <div class="flex h-full flex-col items-center justify-center">
                <div id="dealerScore" class="invisible xl:h-6 2xl:h-7 md:text-base font-medium text-white 2xl:text-xl"></div>
                <div id="dealerShow" class="h-[140px] xl:mb-6 2xl:mb-7 2xl:h-[200px]"></div>
            </div>
        </div>
        <div class="relative h-full bg-green-900/40">
            <div class="absolute left-1/2 top-1/2 -z-10 -translate-x-1/2 -translate-y-1/2 select-none text-center text-6xl md:text-[10rem] 2xl:text-[200px] font-bold uppercase tracking-widest">
                You
            </div>
            <div class="flex h-full flex-col items-center justify-center">
                <div id="playerScore" class="text-base font-medium text-white 2xl:text-xl"></div>
                <div id="playerShow" class="h-[140px] xl:mb-6 2xl:mb-7 2xl:h-[200px]"></div>
            </div>
        </div>
    </section>

    <div id="resultModal" class="fixed inset-0 flex items-center justify-center bg-black/50 invisible">
        <div class="bg-neutral-200 rounded-lg shadow-lg p-6 max-w-60 min-w-60 2xl:max-w-72 2xl:min-w-72 text-wrap text-center">
            <h3 id="resultTitle">Resultado</h3>
            <p id="resultMessage" class="text-lg mb-2 2xl:text-xl">Comentario</p>
            <p id="resultAmount"></p>
            <button id="closeResult" class="mt-4 px-4 py-2 bg-green-700 text-white rounded hover:bg-green-900">
                Close
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
