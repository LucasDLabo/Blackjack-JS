<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Proyecto de JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex flex-col overflow-x-hidden overflow-y-hidden">

    <!-- Upper section with controls -->
    <section class="order-2 flex h-64 items-center pt-1 lg:order-1 lg:h-auto lg:justify-start">
        <!-- Game title -->
        <div class="flex h-32 min-w-full flex-col justify-center gap-3 px-3 lg:flex lg:w-auto lg:min-w-min lg:items-start 2xl:px-10">
            <h1 class="text-center text-5xl font-extrabold italic text-white lg:text-4xl">Blackjack<span class="text-[#F0DB4F] not-italic">JS</span> </h1>
            <button id="btnStart" class="transform rounded-md bg-green-800 px-6 py-3 text-white transition-transform active:scale-90 active:bg-green-500 disabled:hover:bg-green-800 disabled:active:transform-none lg:transition-none lg:hover:bg-green-600">Start Game</button>
        </div>

        <!-- Betting and counting section -->
        <section class="flex w-full flex-col justify-between px-3 lg:h-auto lg:w-full lg:flex-row lg:justify-normal">

            <!-- Father Container for chips and betting controls -->
            <div id="betArea" class="mb-2 hidden justify-center border-b-2 border-slate-800 pb-2 text-white lg:mb-0 lg:h-32 lg:w-full lg:border-b-0 lg:border-l-4 lg:border-slate-800 lg:px-3 lg:pb-0">
                <h2 id="h2text" class="absolute bottom-60 text-xs font-semibold italic text-gray-600 lg:bottom-auto lg:top-0.5 lg:text-sm">Place your bet</h2>

                <!-- Children Container for chips and betting controls -->
                <div class="flex h-full w-full flex-col items-center justify-center gap-3 lg:flex-row lg:gap-5">

                    <div id="controls" class="flex h-full w-full items-center lg:min-w-[12rem] lg:pt-2.5 2xl:max-w-[800px]">

                        <!-- Container for casino chips and hand buttons -->
                        <div id="chips" class="flex min-h-12 w-full flex-nowrap justify-evenly lg:flex-wrap 2xl:gap-0">
                            <button data-value="1" class="chip transform border-white bg-gray-500 active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none lg:hover:opacity-85 lg:active:bg-gray-500">$1</button>
                            <button data-value="5"  class="chip transform border-white bg-red-800 active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none  lg:hover:opacity-85 lg:active:bg-red-800">$5</button>
                            <button data-value="25"  class="chip transform border-white bg-green-800 active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none  lg:hover:opacity-85 lg:active:bg-green-800">$25</button>
                            <button data-value="50"  class="chip transform border-white bg-blue-900 active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none  lg:hover:opacity-85 lg:active:bg-blue-900">$50</button>
                            <button data-value="100"  class="chip transform border-white bg-gray-800 active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none  lg:hover:opacity-85 lg:active:bg-gray-800">$100</button>
                            <button data-value="500"  class="chip transform border-white bg-purple-900 active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none  lg:hover:opacity-85 lg:active:bg-purple-900">$500</button>
                            <button data-value="1000"  class="chip transform  border-white bg-orange-700 active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none lg:hover:opacity-85 lg:active:bg-orange-700">$1000</button>
                            <button data-value="5000"  class="chip transform border-black bg-slate-300 text-black active:scale-90 active:bg-blue-600 active:shadow-inner disabled:transform-none lg:hover:opacity-85 lg:active:bg-slate-300">$5000</button>
                        </div>
                        <!-- Container for game buttons -->
                        <div id="handButtons" class="hidden h-full min-h-12 min-w-full flex-row-reverse items-center justify-between gap-4 lg:flex-row lg:justify-evenly lg:gap-0 2xl:gap-5">
                            <button id="btnHit" title="Take a card" class="flex h-10 w-20 transform items-center justify-center rounded-md bg-blue-800 text-white transition-transform duration-75 active:scale-90 active:bg-blue-500 lg:h-12 lg:w-28 lg:duration-0 lg:hover:bg-blue-700 lg:active:bg-blue-800 lg:disabled:hover:bg-blue-800 2xl:w-32">
                                <span class="flex h-full w-full items-center justify-center border-r-2 text-center text-xs font-medium lg:text-base">Hit</span>
                                <div class="mx-0.5 aspect-square h-5 w-5 lg:h-6 lg:w-6 2xl:h-8 2xl:w-8">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                    </svg> 
                                </div>
                            </button>
                            <button id="btnStand" title="End your turn with this hand" class="flex h-10 w-20 transform items-center justify-center rounded-md bg-red-800 text-white transition-transform duration-75 active:scale-90 active:bg-red-700 lg:h-12 lg:w-28 lg:duration-0 lg:hover:bg-red-700 lg:active:scale-95 lg:disabled:hover:bg-red-800 2xl:w-32">
                                <span class="flex h-full w-full items-center justify-center border-r-2 text-center text-xs font-medium lg:text-base">Stand</span>
                                <div class="aspect-square h-5 w-5 lg:h-6 lg:w-6 2xl:h-8 2xl:w-8">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 256 256">
                                        <path d="M188,88a27.75,27.75,0,0,0-12,2.71V60a28,28,0,0,0-41.36-24.6A28,28,0,0,0,80,44v6.71A27.75,27.75,0,0,0,68,48,28,28,0,0,0,40,76v76a88,88,0,0,0,176,0V116A28,28,0,0,0,188,88Zm12,64a72,72,0,0,1-144,0V76a12,12,0,0,1,24,0v44a8,8,0,0,0,16,0V44a12,12,0,0,1,24,0v68a8,8,0,0,0,16,0V60a12,12,0,0,1,24,0v68.67A48.08,48.08,0,0,0,120,176a8,8,0,0,0,16,0,32,32,0,0,1,32-32,8,8,0,0,0,8-8V116a12,12,0,0,1,24,0Z"></path>
                                    </svg>
                                </div>
                            </button>
                            <button id="btnDouble" title="Double your bet and take one more card" class="flex h-10 w-20 transform items-center justify-center rounded-md bg-green-900 text-white transition-transform duration-75 active:scale-90 active:bg-green-700 disabled:active:bg-green-900 lg:h-12 lg:w-28 lg:duration-0 lg:hover:bg-green-800 lg:active:scale-95 lg:disabled:hover:bg-green-900 2xl:w-32">
                                <span class="flex h-full w-full items-center justify-center border-r-2 text-center text-xs font-medium lg:text-base">Double</span>
                                <div class="aspect-square h-6 w-6 2xl:h-8 2xl:w-8">
                                    <span class="font-bold text-sm lg:text-base 2xl:text-xl">x2</span>
                                </div>
                            </button>
                            <button id="btnInsurance" title="Protect your bet if dealer has blackjack" class="flex h-10 w-20 transform items-center justify-center rounded-md bg-cyan-600 text-white transition-transform duration-75 active:scale-90 active:bg-cyan-500 disabled:active:bg-cyan-600 lg:h-12 lg:w-28 lg:duration-0 lg:hover:bg-cyan-500 lg:active:scale-95 lg:disabled:hover:bg-cyan-600 2xl:w-32">
                                <span class="flex h-full w-full items-center justify-center border-r-2 text-center text-xs font-medium lg:text-base">Insurance</span>
                                <div class="aspect-square h-5 w-5 lg:h-6 lg:w-6 2xl:h-8 2xl:w-8">
                                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 20a16.405 16.405 0 0 1-5.092-5.804A16.694 16.694 0 0 1 5 6.666L12 4l7 2.667a16.695 16.695 0 0 1-1.908 7.529A16.406 16.406 0 0 1 12 20Z"/>
                                    </svg>
                                </div>
                            </button>
                        </div>
                        <!-- Container for next hand button -->
                        <div class="flex min-h-12 items-center">
                            <button id="btnNextHand" class="hidden h-10 w-24 items-center justify-center rounded-md bg-gray-700 text-white active:scale-90 active:bg-gray-500 lg:h-12 lg:w-32 lg:hover:bg-gray-600 lg:active:bg-gray-700">
                                <span class="flex h-full w-full items-center justify-center border-r-2 text-center text-xs font-medium lg:text-base">Next Hand</span>
                                <div class="ml-0.5 aspect-square h-5 w-5 lg:h-6 lg:w-6">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path fill-rule="evenodd" d="M13.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06-1.06L11.69 12 4.72 5.03a.75.75 0 0 1 1.06-1.06l7.5 7.5Z" clip-rule="evenodd" />
                                        <path fill-rule="evenodd" d="M19.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06L17.69 12l-6.97-6.97a.75.75 0 0 1 1.06-1.06l7.5 7.5Z" clip-rule="evenodd" />
                                    </svg>
                                </div>
                                
                            </button>
                        </div>
                    </div>
                    
                    <!-- Section for current bet and deal button -->
                    <section class="flex flex-row items-center gap-2">
                        <!-- Balance and bet container -->
                        <div id="currentBet" class="flex min-w-36 flex-col items-center rounded-md border-[1px] border-slate-800 bg-slate-800 lg:h-fit lg:min-w-32 2xl:min-w-40">
                            <!-- Current Balance -->
                            <div class="flex min-w-full items-center justify-between px-1 py-0.5 font-medium text-green-500 lg:py-0 lg:pt-1">
                                <span id="labelAllIn" class="pointer-events-none absolute translate-x-[5rem] text-center text-xs text-white lg:translate-x-[4.5rem] lg:text-[0.6rem] lg:font-bold 2xl:translate-x-[5.5rem] 2xl:text-sm">All-in</span>
                                <p id="textBalance" class="text-center 2xl:text-lg">$<span id="balance">1000</span></p>
                                <button id="btnResetMoney" title="Reset money" class="hidden size-6 transition active:bg-blue-600 lg:size-auto">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="lg:size-5 lg:cursor-pointer lg:transition-colors lg:hover:text-white 2xl:size-6">
                                        <path fill-rule="evenodd" d="M4.755 10.059a7.5 7.5 0 0 1 12.548-3.364l1.903 1.903h-3.183a.75.75 0 1 0 0 1.5h4.992a.75.75 0 0 0 .75-.75V4.356a.75.75 0 0 0-1.5 0v3.18l-1.9-1.9A9 9 0 0 0 3.306 9.67a.75.75 0 1 0 1.45.388Zm15.408 3.352a.75.75 0 0 0-.919.53 7.5 7.5 0 0 1-12.548 3.364l-1.902-1.903h3.183a.75.75 0 0 0 0-1.5H2.984a.75.75 0 0 0-.75.75v4.992a.75.75 0 0 0 1.5 0v-3.18l1.9 1.9a9 9 0 0 0 15.059-4.035.75.75 0 0 0-.53-.918Z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <button id="btnAllin" title="All-in" class="size-6 select-auto transition active:bg-blue-600 disabled:select-none disabled:opacity-20 disabled:transition-none disabled:active:bg-transparent lg:size-auto lg:transform lg:cursor-pointer lg:transition-colors lg:hover:text-white lg:active:scale-75 lg:active:bg-transparent lg:disabled:transform-none lg:disabled:cursor-default lg:disabled:hover:text-inherit 2xl:size-7">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="lg:ml-1 lg:size-5 2xl:size-6">
                                        <path fill-rule="evenodd" d="M10 1c3.866 0 7 1.79 7 4s-3.134 4-7 4-7-1.79-7-4 3.134-4 7-4Zm5.694 8.13c.464-.264.91-.583 1.306-.952V10c0 2.21-3.134 4-7 4s-7-1.79-7-4V8.178c.396.37.842.688 1.306.953C5.838 10.006 7.854 10.5 10 10.5s4.162-.494 5.694-1.37ZM3 13.179V15c0 2.21 3.134 4 7 4s7-1.79 7-4v-1.822c-.396.37-.842.688-1.306.953-1.532.875-3.548 1.369-5.694 1.369s-4.162-.494-5.694-1.37A7.009 7.009 0 0 1 3 13.179Z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                            <!-- Current Bet -->
                            <div class="flex w-full items-center justify-center border-b-[1px] border-yellow-300 bg-slate-900 py-0.5 text-center">
                                <span class="text-center text-xs font-medium text-yellow-300">Current Bet</span>
                            </div>
                            <div class="flex w-full items-center justify-between rounded-b-md bg-slate-900 px-1 py-0.5 text-center font-medium lg:h-7 lg:py-0">
                                <span id="labelClear" class="pointer-events-none absolute translate-x-[5rem] text-center text-xs text-white lg:translate-x-[4.6rem] lg:text-[0.6rem] lg:font-bold 2xl:translate-x-[5.5rem] 2xl:text-sm">Clear</span>
                                <span class="text-yellow-300 2xl:text-lg">$<span id="totalBet" ></span></span>
                                <button id="btnClear" title="Clear bet" class="size-6 select-auto text-slate-700 transition active:bg-blue-600 disabled:select-none disabled:opacity-20 disabled:transition-none disabled:active:bg-transparent lg:size-auto lg:transform lg:cursor-pointer lg:text-yellow-300 lg:transition-colors lg:hover:text-white lg:active:scale-75 lg:active:bg-transparent lg:disabled:transform-none lg:disabled:cursor-default lg:disabled:hover:text-yellow-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="lg:size-5 2xl:size-6">
                                        <path fillRule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clipRule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <!-- Deal button container -->
                        <div>
                            <button id="btnBet" class="flex h-10 w-24 transform items-center justify-center rounded-md bg-green-800 text-white active:scale-90 active:text-blue-200 disabled:transform-none disabled:hover:bg-green-800 disabled:active:text-white lg:hover:bg-green-700">
                                <span class="flex h-full w-full items-center justify-center border-r-2 text-center font-medium active:border-r-blue-200">Deal</span>
                                <div class="ml-[.15rem] mr-0.5 aspect-square h-6 w-6">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" fill="none"/>
                                        <ellipse cx="96" cy="84" rx="80" ry="36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                                        <path d="M16,84v40c0,19.88,35.82,36,80,36s80-16.12,80-36V84" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="64" y1="117" x2="64" y2="157" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M176,96.72c36.52,3.34,64,17.86,64,35.28,0,19.88-35.82,36-80,36-19.6,0-37.56-3.17-51.47-8.44" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M80,159.28V172c0,19.88,35.82,36,80,36s80-16.12,80-36V132" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="192" y1="165" x2="192" y2="205" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="128" y1="117" x2="128" y2="205" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                                    </svg>
                                </div>
                            </button>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Container for counting cards -->
            <div id="runningCount" class="hidden w-full flex-col justify-center py-0 pt-2 lg:mt-0 lg:h-32 lg:max-w-52 lg:border-l-4 lg:border-slate-800 lg:px-3 xl:max-w-80">
                <h2 class="absolute bottom-[4.8rem] text-xs font-semibold italic text-gray-600 lg:top-0.5 lg:text-sm">Running Count</h2>
                
                <div class="flex flex-col items-center">
                    <h3 id="totalCounter" class="text-sm font-bold text-slate-400 lg:py-1 lg:text-base">Total Cards: </h3>
                    <h4 id="givenCounter" class="mb-1 w-7/12 rounded-lg bg-slate-800 text-center text-sm font-medium text-gray-300 lg:py-0.5 lg:text-base">
                        Cards given: <span class="font-bold text-blue-400">0</span>
                    </h4>
                    <h4 id="remainingCounter"class="w-7/12 rounded-lg bg-slate-800 text-center text-sm font-medium text-gray-300 lg:py-0.5 lg:text-base">
                        Remaining: <span class="font-bold text-green-400">0</span>
                    </h4>
                </div>
            </div>
        </section>
    </section>

    <!-- Main game board section -->
    <section id="gameBoard" class="order-1 flex h-[calc(100dvh-256px)] w-full flex-col justify-center lg:order-2 lg:h-[calc(100vh-128px)]">
        <!-- Dealer -->
        <div class="relative h-full bg-orange-900/40">
            <div class="absolute left-1/2 top-1/2 -z-10 -translate-x-1/2 -translate-y-1/2 select-none text-center text-6xl font-bold uppercase tracking-widest md:text-[10rem] 2xl:text-[200px]">
                Dealer
            </div>
            <div class="flex h-full flex-col items-center justify-center">
                <div id="dealerScore" class="text-xs font-medium text-white 2xl:text-xl"></div>
                <div id="dealerShow" class="flex h-auto w-full justify-center xl:mb-6 2xl:mb-7 2xl:h-[200px]"></div>
            </div>
        </div>
        <!-- Player -->
        <div class="relative h-full bg-green-900/40">
            <div class="absolute left-1/2 top-1/2 -z-10 -translate-x-1/2 -translate-y-1/2 select-none text-center text-6xl font-bold uppercase tracking-widest md:text-[10rem] 2xl:text-[200px]">
                You
            </div>
            <div class="flex h-full flex-col items-center justify-center">
                <div id="playerScore" class="text-xs font-medium text-white 2xl:text-xl"></div>
                <div id="playerShow" class="flex h-auto w-full justify-center xl:mb-6 2xl:mb-7 2xl:h-[200px]"></div>
            </div>
        </div>
    </section>

    <!-- Modal for showing results -->
    <div id="resultModal" class="invisible fixed inset-0 flex items-center justify-center bg-black/50">
        <div class="min-w-60 max-w-60 text-wrap rounded-lg bg-neutral-200 p-6 text-center shadow-lg 2xl:min-w-72 2xl:max-w-72">
            <h3 id="resultTitle">Resultado</h3>
            <p id="resultMessage" class="mb-2 text-lg 2xl:text-xl">Comentario</p>
            <p id="resultAmount"></p>
            <button id="closeResult" class="mt-4 transform rounded bg-green-700 px-4 py-2 text-white transition-transform duration-75 hover:bg-green-900 active:scale-90 lg:duration-0">
                Close
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
